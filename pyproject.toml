[project]
name = "deepfake-core"
version = "0.1.0"
description = "Consent-gated face-swap toolchain for Apple Silicon (see docs/DEEPFAKE_BUILD_PLAN.md)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "onnxruntime>=1.17",
    "PyYAML>=6.0",
    "redis>=4.0",  # Added message broker dependency
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "tqdm>=4.66"]

[project.scripts]
deepfake = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]